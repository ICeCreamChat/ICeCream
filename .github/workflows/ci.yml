name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for UI verification
        run: npx playwright install chromium

      - name: Run unit tests
        run: npm test

      - name: Build timetable V2 bundle
        run: npm run build:timetable-v2

      - name: Verify timetable V2 UI
        run: node test/timetable-v2-ui-verify.mjs

      - name: Verify timetable V2 integration
        run: node test/timetable-v2-integration-verify.mjs
