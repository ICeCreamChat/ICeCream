<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Segment Events Debug</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .log { margin-top: 20px; border: 1px solid #ccc; padding: 10px; max-height: 300px; overflow-y: auto; }
        .log-entry { padding: 4px; border-bottom: 1px solid #eee; }
        input, select { margin: 5px; padding: 5px; }
        label { display: block; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Segment Events Debug</h1>

    <div id="container">
        <label>
            全局课时（分钟）
            <input type="number" id="tt-segment-global-class-minutes" data-global-default-field="classMinutes" value="45">
        </label>

        <label>
            全局课间（分钟）
            <input type="number" id="tt-segment-global-break-minutes" data-global-default-field="breakMinutes" value="10">
        </label>

        <div data-segment-id="seg-1">
            <label>
                时段名称
                <input type="text" data-segment-field="seg-1-label" value="上午时段">
            </label>

            <label>
                首节开始
                <input type="time" data-segment-field="seg-1-startTime" value="08:00">
            </label>

            <label>
                节次数量
                <input type="number" data-segment-field="seg-1-periodCount" value="4">
            </label>

            <label>
                课时（分钟）
                <select data-segment-field="seg-1-classMinutes">
                    <option value="">继承全局</option>
                    <option value="40">40</option>
                    <option value="45" selected>45</option>
                </select>
            </label>
        </div>
    </div>

    <div class="log" id="log">
        <strong>事件日志：</strong>
    </div>

    <script>
        const container = document.getElementById('container');
        const log = document.getElementById('log');

        function addLog(msg) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        container.addEventListener('input', event => {
            const segmentField = event.target.getAttribute('data-segment-field');
            const globalField = event.target.getAttribute('data-global-default-field');

            if (segmentField) {
                addLog('INPUT 事件: data-segment-field="' + segmentField + '", value="' + event.target.value + '"');
            } else if (globalField) {
                addLog('INPUT 事件: data-global-default-field="' + globalField + '", value="' + event.target.value + '"');
            }

            const matches = event.target.matches('[data-segment-field], [data-global-default-field]');
            addLog('  matches([data-segment-field], [data-global-default-field]): ' + matches);
        });

        container.addEventListener('change', event => {
            const segmentField = event.target.getAttribute('data-segment-field');
            const globalField = event.target.getAttribute('data-global-default-field');

            if (segmentField) {
                addLog('CHANGE 事件: data-segment-field="' + segmentField + '", value="' + event.target.value + '"');
            } else if (globalField) {
                addLog('CHANGE 事件: data-global-default-field="' + globalField + '", value="' + event.target.value + '"');
            }

            const matches = event.target.matches('[data-segment-field], [data-global-default-field]');
            addLog('  matches([data-segment-field], [data-global-default-field]): ' + matches);
        });

        addLog('事件监听器已设置，开始修改输入框测试...');
    </script>
</body>
</html>
